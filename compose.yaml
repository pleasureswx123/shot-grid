services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shotgrid
      POSTGRES_USER: shotgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shotgrid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotgrid -d shotgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shotgrid_postgres_data:
